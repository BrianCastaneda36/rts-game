<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iron Dominion - three.js RTS</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js"
} }
</script>
</head>
<body>
<div id="view"></div>
<canvas id="overlay"></canvas>
<div id="topbar">
  <span>Credits: <b id="credits">0</b></span>
  <span>Power: <b id="power">0</b></span>
  <span>Time: <b id="clock">0:00</b></span>
  <span>Renderer: <b id="renderer">...</b></span>
</div>
<div id="sidebar">
  <canvas id="minimap" width="200" height="200"></canvas>
  <div class="hdr">Structures</div>
  <div id="buildBtns" class="grid"></div>
  <div class="hdr">Units <small>(right-click = cancel)</small></div>
  <div id="unitBtns" class="grid"></div>
  <div class="hdr">Selection</div>
  <div id="selinfo">Nothing selected</div>
</div>
<div id="thought"><div class="hdr">Enemy AI brain</div><div id="thoughtBody">booting...</div></div>
<div id="msg"></div>
<div id="loading">Loading three.js...</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
